name: Browser Acceptance

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm version
        run: npm install --global npm@10.9.2
      - name: Record exact revision
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "package-lock.json SHA256: $(sha256sum package-lock.json)"
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production browser acceptance
        run: npm run test:e2e:critical
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
