name: Release Gate

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Full commit SHA to test (workflow_dispatch intentionally accepts arbitrary revisions)
        required: true
        type: string
  pull_request:
    branches: [ main, master ]
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact tested revision
        id: revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.tested_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) tested_sha="$DISPATCH_SHA" ;;
            pull_request) tested_sha="$PR_HEAD_SHA" ;;
            push) tested_sha="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ ! "$tested_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Tested revision is not a full commit SHA" >&2
            exit 1
          fi
          echo "tested_sha=$tested_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.revision.outputs.tested_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@10.9.2

      - name: Reassert tested revision
        shell: bash
        env:
          TESTED_SHA: ${{ steps.revision.outputs.tested_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TESTED_SHA"
          echo "PR9_EXPECTED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "PR9_PR_HEAD_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
            echo "PR9_PR_MERGE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "PR9_TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run verify:release

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release/
          if-no-files-found: warn
